name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -v

      - name: Lint check
        run: |
          ruff check run_pipeline.py scripts/ tests/

  pipeline-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          pip check

      - name: Run full pipeline
        run: python run_pipeline.py

      - name: Validate generated outputs
        run: python scripts/validate_outputs.py

      - name: Verify installation with generated data present
        run: python -m pip install --no-deps -e .

      - name: Save reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: analysis-evidence
          path: |
            results/run_metadata.json
            results/output_manifest.csv
            results/cell_type_composition.csv
            results/figures/08_publication_figure.png
